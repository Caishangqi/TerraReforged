name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # A depth-1 clone is enough: the version string is built from
      # `git rev-parse --short HEAD`, which does not need history.
      - uses: actions/checkout@v4

      # Java 25. The toolchain in buildSrc/src/main/kotlin/CompilationConfig.kt targets release 25,
      # because 26.2 server classes are class file major 69 and a lower --release cannot read them.
      # No toolchain provisioner is configured, so the JDK Gradle needs has to be installed here.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the dependency cache. A pull request reads it, so one PR cannot evict
          # what another needs.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` compiles every included module, runs the unit tests, and shades the Bukkit plugin with
      # the core addons packaged inside it. The first run on a cold cache also downloads the Paper Dev
      # Bundle and remaps the server jar, which takes several minutes. That remap lands in a
      # project-local .gradle directory that the dependency cache above does not cover; caching it
      # separately would need a path inside Paperweight's own layout, and a wrong key there produces a
      # stale remap silently, so it is left uncached until the build time is worth that risk.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: List the artifacts
        run: ls -l platforms/bukkit/build/libs

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: TerraReforged-bukkit
          path: platforms/bukkit/build/libs/*-shaded.jar
          if-no-files-found: error
